site_name: AI 健康伴侣 · 文档中心
site_description: AI 健康伴侣产品文档中心：需求规格、功能清单、原型说明、行业调研、穿戴设备接入方案
docs_dir: docs
site_dir: prototype/docs
exclude_docs: "*.pdf"
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tabbed
extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
extra:
  generator: false
copyright: AI 健康伴侣 · 内部文档（非公开）
nav:
  - 首页: index.md
  - 需求与功能:
      - 产品需求文档（PRD）: PRD-AI健康伴侣.md
      - 软件需求规格说明书: SRS.md
      - 健康伴侣功能清单: 健康伴侣-功能清单.md
      - 原型页面功能清单: 原型页面-功能清单.md
  - 架构与标准:
      - 国际标准架构标准说明书: 国际标准架构标准说明书.md
      - 技术架构书: 技术架构书.md
      - 系统架构图集: 架构图集.md
  - 调研与接入方案:
      - 行业调研报告: 行业调研报告.md
      - 小米手环穿戴接入方案: 穿戴设备接入方案-小米手环.md
      - 食物成分数据源调研: 食物成分数据源调研.md
  - AI Agent 设计:
      - 多 Agent 工作流编排设计: 工作流编排-多Agent闭环设计.md
  - 协作流程:
      - 协作工作台 SOP: 协作工作台SOP.md
  - 大赛材料:
      - 作品简介: 大赛-作品简介.md
      - 路演演讲稿: 大赛-路演演讲稿.md
